[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Nodemailer usa requires dinamicos que esbuild no resuelve bien al empaquetar;
  # se incluye tal cual desde node_modules.
  external_node_modules = ["nodemailer"]

# El orden importa: estas reglas deben ir antes del catch-all del SPA.
[[redirects]]
from = "/api/contact"
to = "/.netlify/functions/contact"
status = 200
force = true

[[redirects]]
from = "/api/health"
to = "/.netlify/functions/health"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
